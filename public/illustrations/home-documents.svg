<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 440" role="img" aria-labelledby="home-documents-title home-documents-description">
  <title id="home-documents-title">Паспорт России, РВП и вид на жительство</title>
  <desc id="home-documents-description">Схематичная иллюстрация паспорта России, разрешения на временное проживание и вида на жительство иностранного гражданина.</desc>
  <style>
    .document-stack {
      transform-box: fill-box;
      transform-origin: center;
      animation: home-document-float 7s ease-in-out infinite;
    }

    .document-ground-shadow {
      fill: #050b09;
      opacity: .3;
      transform-box: fill-box;
      transform-origin: center;
      animation: home-document-shadow 7s ease-in-out infinite;
    }

    @keyframes home-document-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes home-document-shadow {
      0%, 100% { transform: scaleX(1); opacity: .3; }
      50% { transform: scaleX(.9); opacity: .22; }
    }

    @media (prefers-reduced-motion: reduce) {
      .document-stack,
      .document-ground-shadow { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="home-passport-cover" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5b3a40" />
      <stop offset=".55" stop-color="#493035" />
      <stop offset="1" stop-color="#322125" />
    </linearGradient>
    <linearGradient id="home-vnzh-cover" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#204d78" />
      <stop offset=".55" stop-color="#173957" />
      <stop offset="1" stop-color="#0d263f" />
    </linearGradient>
    <pattern id="home-passport-texture" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1h7M1 0v7" stroke="#fff" stroke-opacity=".025" stroke-width=".55" />
    </pattern>
    <filter id="home-document-shadow" x="-45%" y="-40%" width="190%" height="210%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#07100d" flood-opacity=".42" />
    </filter>
    <filter id="home-passport-gold" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 .82 0 0 0 0 .70 0 0 0 0 .44 0 0 0 1 0" />
    </filter>
  </defs>

  <ellipse class="document-ground-shadow" cx="280" cy="397" rx="174" ry="17" />

  <g class="document-stack">
    <g transform="translate(38 98) rotate(-10 100 145)" filter="url(#home-document-shadow)">
      <rect width="200" height="290" rx="18" fill="#dfe4dc" />
      <rect x="10" y="10" width="180" height="270" rx="12" fill="none" stroke="#5c7869" stroke-opacity=".55" />
      <text x="100" y="38" fill="#26342e" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.1">РОССИЯ</text>
      <text x="100" y="67" fill="#26342e" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">РАЗРЕШЕНИЕ</text>
      <text x="100" y="84" fill="#26342e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">НА ВРЕМЕННОЕ</text>
      <text x="100" y="99" fill="#26342e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">ПРОЖИВАНИЕ</text>
      <path d="M28 123h144M28 139h104M28 155h144M28 171h86" stroke="#7e9488" stroke-width="1" opacity=".55" />
      <g transform="rotate(-7 69 218)" opacity=".92">
        <rect x="25" y="199" width="88" height="38" rx="2" fill="#2b6597" fill-opacity=".08" stroke="#2b6597" stroke-width="2.7" />
        <text x="69" y="222" fill="#2b6597" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".45">РАЗРЕШЕНО</text>
      </g>
      <circle cx="145" cy="216" r="27" fill="none" stroke="#5c7869" stroke-width="2" opacity=".72" />
      <text x="145" y="213" fill="#5c7869" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">РВП</text>
      <text x="145" y="227" fill="#5c7869" font-family="Arial, sans-serif" font-size="6" text-anchor="middle" letter-spacing=".8">ДОКУМЕНТ</text>
    </g>

    <g transform="translate(322 98) rotate(10 100 145)" filter="url(#home-document-shadow)">
      <rect width="200" height="290" rx="18" fill="url(#home-vnzh-cover)" />
      <rect x="10" y="10" width="180" height="270" rx="12" fill="none" stroke="#091d31" stroke-opacity=".7" />
      <text x="100" y="39" fill="#d4b978" font-family="Georgia, serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">РОССИЙСКАЯ</text>
      <text x="100" y="55" fill="#d4b978" font-family="Georgia, serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">ФЕДЕРАЦИЯ</text>
      <image href="russian-coat-of-arms.png" x="52" y="78" width="96" height="96" preserveAspectRatio="xMidYMid meet" filter="url(#home-passport-gold)" />
      <text x="100" y="207" fill="#e1c88e" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing=".45">ВИД НА ЖИТЕЛЬСТВО</text>
      <text x="100" y="225" fill="#e1c88e" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing=".2">ИНОСТРАННОГО ГРАЖДАНИНА</text>
    </g>

    <g transform="translate(172 48)" filter="url(#home-document-shadow)">
      <rect width="216" height="320" rx="20" fill="url(#home-passport-cover)" />
      <rect width="216" height="320" rx="20" fill="url(#home-passport-texture)" />
      <rect x="10" y="10" width="196" height="300" rx="14" fill="none" stroke="#160d0f" stroke-opacity=".36" />
      <text x="108" y="42" fill="#d4b978" font-family="Georgia, serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">РОССИЙСКАЯ</text>
      <text x="108" y="60" fill="#d4b978" font-family="Georgia, serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">ФЕДЕРАЦИЯ</text>
      <image href="russian-coat-of-arms.png" x="52" y="98" width="112" height="112" preserveAspectRatio="xMidYMid meet" filter="url(#home-passport-gold)" />
      <text x="108" y="274" fill="#d4b978" font-family="Georgia, serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="5">ПАСПОРТ</text>
    </g>
  </g>
</svg>
